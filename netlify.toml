# Build: the site is prerendered to static HTML (TanStack Start), published from .output/public.
[build]
  command = "npm run build"
  publish = ".output/public"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"

# Redirect .html URLs to their clean canonical equivalents (301, permanent).
# Consolidates link equity onto the URL declared in <link rel="canonical">
# and in sitemap.xml, avoiding duplicate-content dilution.
# "force = true" is required because a static .html file exists at each path
# and would otherwise be served directly instead of hitting this redirect.

[[redirects]]
  from = "/*.html"
  to = "/:splat"
  status = 301
  force = true
[[edge_functions]]
  path = "/*"
  function = "geo-block"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
