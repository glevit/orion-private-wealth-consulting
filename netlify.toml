# Build: the site is prerendered to static HTML (TanStack Start), published from .output/public.
[build]
  command = "npm run build"
  publish = ".output/public"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"
  NITRO_PRESET = "cloudflare-module"

# Redirect .html URLs to their clean canonical equivalents (301, permanent).
# Consolidates link equity onto the URL declared in <link rel="canonical">
# and in sitemap.xml, avoiding duplicate-content dilution.
# "force = true" is required because a static .html file exists at each path
# and would otherwise be served directly instead of hitting this redirect.

[[redirects]]
  from = "/*.html"
  to = "/:splat"
  status = 301
  force = true

# English pages are prerendered as <route>/index.html, so Netlify would 301
# /<route> to /<route>/ while <link rel="canonical"> and sitemap.xml declare
# /<route> (no slash). These forced 200 rewrites serve the canonical URL
# directly, with no redirect hop. Localized pages (/es/..., etc.) are flat
# .html files and are unaffected.
[[redirects]]
  from = "/services"
  to = "/services/index.html"
  status = 200
  force = true
